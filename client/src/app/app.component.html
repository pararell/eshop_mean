<div class="main-scroll-wrap" id="main-content" (scroll)="onScrolling($event)">
  @if (!admin()) {
    <app-header />
  }
  <main id="content" class="app-content" tabindex="-1">
    <router-outlet (activate)="onActivate($event)" (deactivate)="onDeactivate($event)" />
  </main>
  @if (!admin()) {
    <app-footer />
  }
</div>
