<form class="checkout" novalidate (submit)="$event.preventDefault(); pay()">
  @if (unavailable()) {
    <p class="card-errors" role="alert">{{ 'Card_payments_unavailable' | translate | async }}</p>
  } @else {
    <div #paymentElement class="payment-element" data-testid="payment-element"></div>
    @if (!ready()) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading the payment form" />
    }
    <button
      mat-raised-button
      color="primary"
      class="card-button"
      id="submit-button"
      type="submit"
      [disabled]="!ready() || busy() || disabled()"
      [attr.aria-busy]="busy()"
    >
      {{ 'MakeOrder' | translate | async }} {{ 'and' | translate | async }} {{ 'Pay' | translate | async }} {{ price() }} {{ currency() }}
    </button>
    @if (busy()) {
      <mat-progress-bar mode="indeterminate" aria-label="Paying" />
    }
    <div class="card-errors" id="card-errors" role="alert" aria-live="assertive">
      @if (error()) {
        <span>{{ error() | translate | async }}</span>
      }
    </div>
  }
</form>
