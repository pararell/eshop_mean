<div class="main">
  <div class="container">
    <button (click)="goBack()" mat-raised-button color="primary">
      <i class="material-icons left">arrow_back</i>
      {{ 'Back' | translate | async }}
    </button>

    @if (order$(); as order) {
      <h2 role="status">
        @if (pending()) {
          {{ 'Payment_processing' | translate | async }}
        } @else {
          {{ 'SuccessOrder' | translate | async }}
        }
      </h2>
      <app-order-info [order]="order" [lang]="(lang$ | async)!" />
    } @else {
      <h2 role="status">{{ 'Payment_checking' | translate | async }}</h2>
    }
  </div>
</div>
