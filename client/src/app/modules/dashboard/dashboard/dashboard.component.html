<div class="main">
  <div class="dashboard-container">
    <div class="orders-menu">
      <h1 class="dashboard-title">Dashboard</h1>
      <button
        class="orders-button"
        [routerLink]="['/' + (lang$ | async) + '/dashboard/orders']"
        mat-raised-button
        color="primary"
        aria-label="Orders"
      >
        Orders
      </button>
    </div>
    <mat-tab-group #MatTabGroup backgroundColor="primary" animationDuration="0ms">
      <mat-tab label="Products">
        <div class="dashboard-tab-content">
          <app-admin-products />
        </div>
      </mat-tab>
      <mat-tab label="Categories">
        <ng-template matTabContent>
          <div class="dashboard-tab-content">
            <app-categories-edit />
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="Pages">
        <ng-template matTabContent>
          <div class="dashboard-tab-content">
            <app-pages-edit />
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="Theme">
        <ng-template matTabContent>
          <div class="dashboard-tab-content">
            <app-theme-edit />
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="Config">
        <ng-template matTabContent>
          <div class="dashboard-tab-content">
            <app-config-edit />
          </div>
        </ng-template>
      </mat-tab>
      <mat-tab label="Translations">
        <ng-template matTabContent>
          <div class="dashboard-tab-content">
            <app-translations-edit />
          </div>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
    <p class="dashboard-version">{{ version }}</p>
  </div>
</div>
