@if (editorApiKey$ | async; as editorApiKey) {
  <!-- One iteration per color mode: a new mode recreates the editor with the matching skin -->
  @for (mode of [dark()]; track mode) {
    <editor apiKey="{{ editorApiKey }}" [ngModel]="content()" (ngModelChange)="onEditorChange($event)" [init]="init()" />
  }
}
