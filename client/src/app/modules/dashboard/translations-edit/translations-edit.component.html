<div class="translations-subform">
  @for (translation of (translationSub$ | async); track translation; let i = $index) {
  <div>
    <div [formGroup]="$any(languageForm.controls[translation.lang])">
      <h1>{{ translation.lang }}</h1>

      @for (sentence of translation.keys | keyvalue; track sentence) {

      <div class="translation-sentence">
        @if (!i) {
        <button class="translations-button" (click)="removeTranslation(sentence.key)" mat-mini-fab color="accent">-</button>
        }
        <mat-form-field class="product_edit-field">
          <mat-label>{{ sentence.key }}</mat-label>
          <input matInput [formControlName]="$any(sentence.key)" />
        </mat-form-field>
      </div>

      }
    </div>
    <mat-form-field class="product_edit-field">
      <mat-label>{{ translation.lang }} JSON</mat-label>
      <textarea matInput [(ngModel)]="languageForm.get(translation.lang + '_json').value" [ngModelOptions]="{standalone: true}"></textarea>
    </mat-form-field>
  </div>
  }
</div>
<div>
  <mat-form-field class="product_edit-field">
    <mat-label>Add key</mat-label>
    <input matInput formControlName="add" type="text" name="add" />
  </mat-form-field>
  <button (click)="addKeyToTranslation()" mat-mini-fab color="primary">+</button>
</div>
<button mat-raised-button color="primary" class="action-button" (click)="submitForm()">Update translations</button>
<button mat-raised-button color="primary" class="action-button" (click)="submitJSON()">Update translations from JSON</button>
