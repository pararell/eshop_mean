<ul class="category-grid" [class.category-grid-scroll]="withSlider()" role="list">
  @for (category of visibleCategories(); track category.titleUrl; let i = $index) {
    <li class="category_card" [class]="trailClass(i)">
      <a class="category_card-link" [routerLink]="['/' + lang() + '/product/category/' + category.titleUrl]">
        <span class="category_card-media">
          @if (category.mainImage?.url) {
            <img [ngSrc]="category.mainImage!.url" alt="" fill sizes="(max-width: 680px) 50vw, 25vw" />
          }
        </span>
        <span class="signpost category_card-sign">
          <span class="blaze" aria-hidden="true"></span>
          <span class="category_card-title">{{ category.title }}</span>
        </span>
      </a>
    </li>
  }
</ul>
