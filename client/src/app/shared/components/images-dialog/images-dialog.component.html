<div class="lightbox" [class.is-zoomed]="zoomed()">
  <div class="lightbox-bar">
    <span class="lightbox-counter">{{ index() + 1 }} / {{ count }}</span>
    <button type="button" class="lightbox-button" (click)="zoomed.set(!zoomed())" [attr.aria-pressed]="zoomed()" aria-label="Zoom">
      <app-icon name="zoom" />
    </button>
    <button type="button" class="lightbox-button" (click)="close()" aria-label="Close">
      <app-icon name="close" />
    </button>
  </div>

  <div class="lightbox-stage">
    <img [src]="current()" [alt]="data.alt || ''" (click)="zoomed.set(!zoomed())" />
  </div>

  @if (count > 1) {
    <button type="button" class="lightbox-button lightbox-arrow lightbox-arrow-prev" (click)="prev()" aria-label="Previous image">
      <app-icon name="chevronLeft" [size]="24" />
    </button>
    <button type="button" class="lightbox-button lightbox-arrow lightbox-arrow-next" (click)="next()" aria-label="Next image">
      <app-icon name="chevronRight" [size]="24" />
    </button>
  }
</div>
