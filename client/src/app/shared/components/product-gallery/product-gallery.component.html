<div class="gallery" role="group" aria-roledescription="carousel" [attr.aria-label]="alt()" tabindex="0" (keydown)="onKeydown($event)">
  <div class="gallery-stage">
    @if (current()) {
      <button
        type="button"
        class="gallery-main"
        (pointerdown)="onPointerDown($event)"
        (pointerup)="onPointerUp($event)"
        (click)="onMainClick()"
        aria-label="Zoom"
      >
        <img [src]="current()" [alt]="alt()" fetchpriority="high" draggable="false" />
      </button>
      <span class="gallery-zoom" aria-hidden="true"><app-icon name="zoom" [size]="18" /></span>
    }
    @if (hasMany()) {
      <button type="button" class="gallery-arrow gallery-arrow-prev" (click)="prev()" aria-label="Previous image">
        <app-icon name="chevronLeft" />
      </button>
      <button type="button" class="gallery-arrow gallery-arrow-next" (click)="next()" aria-label="Next image">
        <app-icon name="chevronRight" />
      </button>
      <span class="gallery-counter" aria-live="polite">{{ index() + 1 }} / {{ images().length }}</span>
    }
  </div>

  @if (hasMany()) {
    <div class="gallery-thumbs">
      @for (image of images(); track image; let i = $index) {
        <button
          type="button"
          class="gallery-thumb"
          [class.is-active]="i === index()"
          [attr.aria-current]="i === index()"
          [attr.aria-label]="'Image ' + (i + 1) + ' of ' + images().length"
          (click)="select(i)"
        >
          <img [src]="image" alt="" loading="lazy" decoding="async" />
        </button>
      }
    </div>
  }
</div>
