<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Eshop Mean</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Angular - Node.js - Eshop application - MEAN Eshop with dashboard" />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      .spinner {
        height: 48px;
        width: 48px;
        animation: rotate 0.9s infinite linear;
        border: 4px solid #111;
        border-right-color: transparent;
        border-radius: 50%;
        margin: 100px auto;
      }

      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- Light/dark choice (ThemeService) applied before first paint; no choice = follow the system -->
    <script>
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )eshop_theme=(light|dark)/);
          if (m) document.documentElement.setAttribute('data-theme', m[1]);
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="mat-typography">
    <eshop-mean-app>
      <div id="spinner" class="spinner"></div>
    </eshop-mean-app>
  </body>
</html>
